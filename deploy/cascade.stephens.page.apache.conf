# Reference copies of the Apache vhosts installed at
#   /etc/apache2/sites-available/cascade.stephens.page.conf       (HTTP -> HTTPS)
#   /etc/apache2/sites-available/cascade.stephens.page-le-ssl.conf (HTTPS)
#
# To re-deploy from a fresh server:
#
#   sudo cp deploy/cascade.stephens.page.apache.conf \
#     /etc/apache2/sites-available/cascade.stephens.page.conf
#   sudo a2enmod rewrite headers
#   sudo a2ensite cascade.stephens.page.conf
#   sudo systemctl reload apache2
#   sudo certbot --apache -d cascade.stephens.page --redirect
#
# Then copy the HTTPS block below into …-le-ssl.conf (certbot generates a
# template; replace its body with the block below to pick up the SPA
# fallback + MIME types).

# ---------------- HTTP (port 80) — redirect everything to HTTPS ----------------

<VirtualHost *:80>
    ServerName cascade.stephens.page
    ServerAdmin jacob.stephens.701@gmail.com
    DocumentRoot /var/www/cascade.stephens.page/apps/web/dist

    <Directory /var/www/cascade.stephens.page/apps/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    AddType application/wasm .wasm
    AddType application/manifest+json .webmanifest

    # Apple fetches the App Site Association file (Universal Links) and requires
    # it served as JSON with no extension and no redirect. It is a real file in
    # dist/, so the SPA rewrite (!-f) never rewrites it.
    <Files "apple-app-site-association">
        ForceType application/json
    </Files>

    <FilesMatch "\.(js|css|wasm|ogg|png|svg|webmanifest)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^(index\.html|sw\.js|registerSW\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/cascade.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/cascade.stephens.page-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =cascade.stephens.page
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# ---------------- HTTPS (port 443) — actual app ----------------

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName cascade.stephens.page
    ServerAdmin jacob.stephens.701@gmail.com
    DocumentRoot /var/www/cascade.stephens.page/apps/web/dist

    <Directory /var/www/cascade.stephens.page/apps/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # SPA fallback. DOCUMENT_ROOT + REQUEST_URI is the reliable form at
        # vhost / directory scope; REQUEST_FILENAME is unset before url->file
        # mapping at vhost level and would swallow asset requests.
        RewriteEngine On
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    AddType application/wasm .wasm
    AddType application/manifest+json .webmanifest

    # Apple fetches the App Site Association file (Universal Links) and requires
    # it served as JSON with no extension and no redirect. It is a real file in
    # dist/, so the SPA rewrite (!-f) never rewrites it.
    <Files "apple-app-site-association">
        ForceType application/json
    </Files>

    <FilesMatch "\.(js|css|wasm|ogg|png|svg|webmanifest)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "^(index\.html|sw\.js|registerSW\.js)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/cascade.stephens.page-error.log
    CustomLog ${APACHE_LOG_DIR}/cascade.stephens.page-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/cascade.stephens.page/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/cascade.stephens.page/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
