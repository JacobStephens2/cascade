[package]
name = "cascade-sync-server"
version = "0.1.0"
edition = "2021"
authors = ["Jacob Stephens <jstephens@vagabondtours.com>"]
license = "MIT"
repository = "https://github.com/JacobStephens2/cascade"
description = "Cascade listening-time sync service: magic-link auth + G-Counter aggregation over Postgres."

# Detach from the parent cascade workspace: this service has its own heavy
# dependency tree (axum/sqlx/tokio) that has no business in the core/shell
# lockfile, and it never cross-compiles to wasm/mobile. An empty [workspace]
# table makes this its own workspace root.
[workspace]

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1-rustls-tls",
    "builder",
    "hostname",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
