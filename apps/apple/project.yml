# XcodeGen project spec for Cascade Apple (macOS + iOS).
#
# Regenerate `Cascade.xcodeproj`:
#   brew install xcodegen && xcodegen generate
#
# Both targets share every file under CascadeShared/ — Swift sources,
# UniFFI-generated bindings + modulemap, audio engine, persisted-settings
# store, Now Playing publisher. Each target adds its own scene + lifecycle.
name: Cascade
options:
  bundleIdPrefix: page.stephens
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: "LHY8W725A8" # Apple Developer Program team (paid)
    # Swift *language* mode (must be 5.0 / 6.0 — "5.10" is a compiler version,
    # not a language mode, and silently falls back to Swift 6 mode). Stay on 5
    # so main-thread Timer/AVFoundation callbacks aren't rejected by Swift 6's
    # strict actor-isolation checks.
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: Cascade
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  # -------------------------------- macOS ----------------------------------
  CascadeMac:
    type: application
    platform: macOS
    sources:
      - path: CascadeShared
      - path: CascadeMac
        excludes:
          - "Resources/.gitkeep"
    resources:
      - path: CascadeMac/Resources
        optional: true
    info:
      path: CascadeMac/Info.plist
      properties:
        CFBundleDisplayName: Cascade
        NSHighResolutionCapable: true
        # Required so MPNowPlayingInfoCenter shows up in Control Center.
        MPNowPlayingInfoPropertyMediaType: 1
        NSHumanReadableCopyright: "© 2026 Jacob Stephens"
    entitlements:
      path: CascadeMac/Cascade.entitlements
      properties:
        # App Sandbox: audio + Application Support writes + IOKit power
        # assertions + MediaPlayer Now Playing all work under sandbox.
        com.apple.security.app-sandbox: true
        # Outbound network for the optional account/listening-time sync
        # (magic-link sign-in + G-Counter sync to cascade-sync-server).
        com.apple.security.network.client: true
        # Universal Links: lets the magic-link email (https://cascade.stephens.page
        # /auth?token=…) open the app straight into completeSignIn() instead of a
        # browser. Requires the matching AASA file hosted at
        # https://cascade.stephens.page/.well-known/apple-app-site-association and
        # a provisioning profile with the Associated Domains capability (paid
        # Apple Developer Program — not available under free personal-team signing).
        com.apple.developer.associated-domains:
          - applinks:cascade.stephens.page
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.stephens.cascade
        CODE_SIGN_ENTITLEMENTS: CascadeMac/Cascade.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        OTHER_LDFLAGS: "$(inherited) -L$(SRCROOT)/build/rust/macos -lcascade_uniffi"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CascadeShared/Generated"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/build/rust/macos"
    dependencies: []

  # -------------------------------- iOS ------------------------------------
  CascadeiOS:
    type: application
    platform: iOS
    sources:
      - path: CascadeShared
      - path: CascadeiOS
        excludes:
          - "Resources/.gitkeep"
    resources:
      - path: CascadeiOS/Resources
        optional: true
    info:
      path: CascadeiOS/Info.plist
      properties:
        CFBundleDisplayName: Cascade
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        # Keep the audio engine running when the screen locks or the app is
        # backgrounded — non-negotiable for an 8-hour focus session player.
        UIBackgroundModes:
          - audio
        # Required so MPNowPlayingInfoCenter shows on the lock screen / Control
        # Center for AirPods / headphone-button control.
        MPNowPlayingInfoPropertyMediaType: 1
        NSHumanReadableCopyright: "© 2026 Jacob Stephens"
    entitlements:
      path: CascadeiOS/Cascade.entitlements
      properties:
        # Universal Links — see the macOS target above. iOS reaches the network
        # without a sandbox entitlement, so associated-domains is the only key.
        # (Must live here, not in the .entitlements file: XcodeGen regenerates
        # that file on every run and would clobber a hand-written key — see #1.)
        com.apple.developer.associated-domains:
          - applinks:cascade.stephens.page
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.stephens.cascade
        CODE_SIGN_ENTITLEMENTS: CascadeiOS/Cascade.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        # Per-SDK lookup so the same xcodeproj builds for both on-device and
        # the simulator (which on Apple Silicon is an arm64 simulator slice).
        "OTHER_LDFLAGS[sdk=iphoneos*]": "$(inherited) -L$(SRCROOT)/build/rust/ios-device -lcascade_uniffi"
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": "$(inherited) -L$(SRCROOT)/build/rust/ios-sim -lcascade_uniffi"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": "$(SRCROOT)/build/rust/ios-device"
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(SRCROOT)/build/rust/ios-sim"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/CascadeShared/Generated"
    # Embed the watchOS companion. Xcode handles the bundle-inside-a-bundle
    # packaging once the dependency is declared.
    dependencies:
      - target: CascadeWatch
        embed: true

  # -------------------------------- watchOS --------------------------------
  # Mode A — thin remote. The watch sends commands to the iPhone via
  # WatchConnectivity (WCSession) and renders whatever snapshot the iPhone
  # pushes back. No Rust, no audio engine, no timer math on the watch.
  CascadeWatch:
    type: application
    platform: watchOS
    sources:
      # The whole CascadeShared/ tree is on the include path, but only the
      # Watch/WatchProtocol.swift file is actually needed on the watch — the
      # rest pulls in AVFoundation / IOKit headers that aren't available here.
      - path: CascadeShared/Watch
      - path: CascadeWatch
        excludes:
          - "Resources/.gitkeep"
    resources:
      - path: CascadeWatch/Resources
        optional: true
    info:
      path: CascadeWatch/Info.plist
      properties:
        CFBundleDisplayName: Cascade
        # Marks this as a (modern, single-target) watchOS app. Without it,
        # installd rejects the embedded watch bundle ("no WKApplication key").
        WKApplication: true
        WKWatchOnly: false
        # Pairs the watch app to the iPhone app as its companion — required for
        # the embedded watch bundle to install alongside its iOS host.
        WKCompanionAppBundleIdentifier: page.stephens.cascade
        NSHumanReadableCopyright: "© 2026 Jacob Stephens"
    entitlements:
      path: CascadeWatch/Cascade.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: page.stephens.cascade.watchkitapp
        CODE_SIGN_ENTITLEMENTS: CascadeWatch/Cascade.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"            # watchOS
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # The watch is paired to the iPhone app via shared bundle ID prefix +
        # the WKCompanionAppBundleIdentifier in Info.plist (Xcode wires this
        # automatically because we embed via the iOS target's dependency).
    dependencies: []
